plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    namespace 'com.courseflow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.courseflow.app'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '3.2.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}


